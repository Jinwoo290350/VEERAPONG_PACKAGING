<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- EPE foam bags & sheets — pink anti-static + white, studio blue backdrop -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6ba8"/>
      <stop offset="0.5" stop-color="#0e3a66"/>
      <stop offset="1" stop-color="#081d38"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fbe9e5"/>
      <stop offset="1" stop-color="#f3c9c1"/>
    </linearGradient>
    <linearGradient id="pinkFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b0a7"/>
      <stop offset="1" stop-color="#f3c9c1"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ebf0"/>
    </linearGradient>
    <linearGradient id="whiteFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d5dd"/>
      <stop offset="1" stop-color="#e4ebf0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03101f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- back pink bag -->
  <g filter="url(#soft)" transform="rotate(-4 300 250)">
    <rect x="150" y="90" width="300" height="360" rx="14" fill="url(#pink)"/>
    <rect x="150" y="90" width="300" height="64" rx="14" fill="url(#pinkFlap)"/>
    <path d="M175 190 q120 26 250 6M175 260 q130 30 250 8M175 330 q120 26 250 6M175 398 q130 28 250 8" stroke="#ffffff" stroke-opacity="0.5" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- back white bag -->
  <g filter="url(#soft)" transform="rotate(5 560 260)">
    <rect x="440" y="110" width="250" height="330" rx="14" fill="url(#white)"/>
    <rect x="440" y="110" width="250" height="56" rx="14" fill="url(#whiteFlap)"/>
    <path d="M462 210 q100 22 206 5M462 280 q106 24 206 6M462 350 q100 22 206 5" stroke="#ffffff" stroke-opacity="0.75" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- front white sheet -->
  <g filter="url(#soft)" transform="rotate(-7 330 470)">
    <rect x="200" y="360" width="260" height="190" rx="12" fill="url(#white)"/>
    <path d="M222 410 q100 20 216 4M222 462 q106 22 216 5M222 512 q100 20 216 4" stroke="#c7d3da" stroke-opacity="0.9" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- front pink small bag -->
  <g filter="url(#soft)" transform="rotate(6 560 480)">
    <rect x="470" y="390" width="190" height="170" rx="12" fill="url(#pink)"/>
    <rect x="470" y="390" width="190" height="38" rx="12" fill="url(#pinkFlap)"/>
    <path d="M488 460 q78 16 154 4M488 508 q80 16 154 4" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
